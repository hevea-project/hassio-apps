name: Hevea OpenVPN client
description: Hevea OpenVPN client
version: 1.0.0
slug: hassio-openvpn
init: false
url: https://github.com/hevea-project/hevea-hassio-apps/tree/main/hassio-openvpn
privileged:
- NET_ADMIN
devices:
- /dev/net/tun
host_network: true
arch:
- aarch64
- amd64
options:
  remote: localhost
  port: 1194
  ca: ''
  cert: ''
  key: ''
schema:
  remote: str
  port: int
  ca: str
  cert: str
  key: str
map:
- type: addons
  read_only: false
- type: all_addon_configs
  read_only: false
  path: /all_addon_configs
- type: backup
  read_only: false
- type: homeassistant_config
  read_only: false
  path: /config
- type: media
  read_only: false
- type: share
  read_only: false
- type: ssl
  read_only: false
image: docker.io/lebauce/hassio-openvpn
